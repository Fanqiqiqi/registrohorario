<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados</title>
    <link rel="stylesheet" href="Employee.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="dropdown">
            <button class="dropdown-btn"><i class="fas fa-bars"></i> Menú</button>
            <div class="dropdown-content">
                <a href="Vacation.html"><i class="fas fa-calendar-alt"></i> Vacaciones</a>
                <a href="index.html"><i class="fas fa-clock"></i> Horario</a>
                <a href="Employee.html"><i class="fas fa-users"></i> Empleados</a>
            </div>
        </div>
        <h1>Gestión de Empleados</h1>
        <div class="employee-form">
            <button onclick="openModal('add')">Agregar Empleado</button>
        </div>
        <table id="employeeTable">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nombre</th>
                    <th>Primer Apellido</th>
                    <th>Segundo Apellido</th>
                    <th>Número de Identificación</th>
                    <th>Número de Seguro</th>
                    <th>Fecha de Nacimiento</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Agregar Nuevo Empleado</h2>
            <div class="modal-grid">
                <div class="form-fields">
                    <form id="employeeForm">
                        <input type="text" id="employeeName" placeholder="Nombre" required>
                        <input type="text" id="firstSurname" placeholder="Primer Apellido" required>
                        <input type="text" id="secondSurname" placeholder="Segundo Apellido">
                        <input type="text" id="employeeId" placeholder="Número de Identificación" required>
                        <input type="text" id="insurance" placeholder="Número de Seguro" required>
                        <div class="birth-date">
                            <input type="number" id="birthDay" placeholder="Día" min="1" max="31" required>
                            <input type="number" id="birthMonth" placeholder="Mes" min="1" max="12" required>
                            <input type="number" id="birthYear" placeholder="Año" min="1900" max="2025" required>
                        </div>
                        <input type="file" id="employeeImage" accept="image/*">
                        <div class="modal-buttons">
                            <button type="button" onclick="closeModal()">Cancelar</button>
                            <button type="submit" id="saveButton">Guardar</button>
                        </div>
                    </form>
                </div>
                <div class="image-preview">
                    <img id="imagePreview" src="" alt="Vista previa de la imagen" style="display: none;">
                    <p id="noImageText">No se ha seleccionado ninguna imagen</p>
                </div>
            </div>
        </div>
    </div>
    <script src="Employee.js"></script>
    <script>
        // Toggle dropdown menu
        document.addEventListener('DOMContentLoaded', () => {
            const dropdownBtn = document.querySelector('.dropdown-btn');
            const dropdownContent = document.querySelector('.dropdown-content');
            
            dropdownBtn.addEventListener('click', () => {
                dropdownContent.classList.toggle('show');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (event) => {
                if (!dropdownBtn.contains(event.target) && !dropdownContent.contains(event.target)) {
                    dropdownContent.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>

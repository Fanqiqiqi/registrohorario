<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro de Tiempo de Empleados</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="dropdown menu-dropdown">
            <button class="dropdown-btn"><i class="fas fa-bars"></i> Menú</button>
            <div class="dropdown-content">
                <a href="Vacation.html"><i class="fas fa-calendar-alt"></i> Vacaciones</a>
                <a href="index.html"><i class="fas fa-clock"></i> Horario</a>
                <a href="Employee.html"><i class="fas fa-users"></i> Empleados</a>
            </div>
        </div>
        <h1>Sistema de Registro de Tiempo de Empleados</h1>
        <div class="employee-select">
            <div class="input-group">
                <select id="employeeSelect">
                    <option value="">Seleccionar Empleado</option>
                </select>
                <input type="date" id="dateInput" required>
                <button onclick="checkIn()">Registrar Entrada</button>
                <button class="check-out" onclick="checkOut()">Registrar Salida</button>
            </div>
            <div class="button-group">
                <button onclick="toggleFilterSidebar()">Filtro</button>
                <button onclick="printRecords()">Imprimir</button>
                <button class="download-pdf" onclick="downloadPDF()">Descargar PDF</button>
            </div>
        </div>
        <table id="timeTable">
            <thead>
                <tr>
                    <th>Nombre del Empleado</th>
                    <th>Fecha</th>
                    <th>Hora de Entrada</th>
                    <th>Hora de Salida</th>
                    <th>Duración del Trabajo</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="filterSidebar" class="filter-sidebar">
        <h2>Filtro de Registros</h2>
        <label>Desde:</label>
        <input type="date" id="startDate" />
        <label>Hasta:</label>
        <input type="date" id="endDate" />
        <label>Nombre del Empleado:</label>
        <select id="filterEmployeeSelect">
            <option value="">Todos los Empleados</option>
        </select>
        <div class="filter-buttons">
            <button onclick="applyFilter()">Aplicar Filtro</button>
            <button onclick="resetFilter()">Restablecer</button>
            <button onclick="toggleFilterSidebar()">Cerrar</button>
        </div>
    </div>

    <div class="employee-photo-container" id="employeePhotoContainer">
        <img id="employeePhoto" src="" alt="Foto del Empleado" style="display: none;">
        <p id="noPhotoText">No se ha seleccionado ningún empleado</p>
    </div>

    <script src="index.js"></script>
    <script>
        // Toggle dropdown menu
        document.addEventListener('DOMContentLoaded', () => {
            const dropdownBtn = document.querySelector('.dropdown-btn');
            const dropdownContent = document.querySelector('.dropdown-content');
            
            dropdownBtn.addEventListener('click', () => {
                dropdownContent.classList.toggle('show');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (event) => {
                if (!dropdownBtn.contains(event.target) && !dropdownContent.contains(event.target)) {
                    dropdownContent.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
